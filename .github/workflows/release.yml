name: Build and publish ListenUp DMG

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: listenup-release
  cancel-in-progress: true

jobs:
  build-and-publish:
    runs-on: macos-15

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Run tests
        run: swift test

      - name: Build unsigned DMG
        run: ./scripts/package-unsigned-dmg.sh

      - name: Publish rolling latest release
        if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          version="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' AppResources/Info.plist)"
          dmg="release/ListenUp-${version}-arm64-unsigned.dmg"
          checksum="${dmg}.sha256"
          release_id="$(gh api "repos/${REPOSITORY}/releases/tags/latest" --jq '.id' 2>/dev/null || true)"

          if [[ -z "${release_id}" ]]; then
            gh release create latest \
              --target "${COMMIT_SHA}" \
              --title "ListenUp latest" \
              --notes "자동 생성된 최신 베타입니다. main 브랜치의 최신 커밋에서 빌드되었습니다." \
              --prerelease \
              "${dmg}" "${checksum}"
          else
            if gh api "repos/${REPOSITORY}/git/ref/tags/latest" >/dev/null 2>&1; then
              gh api --method PATCH \
                "repos/${REPOSITORY}/git/refs/tags/latest" \
                -f sha="${COMMIT_SHA}" \
                -F force=true
            else
              gh api --method POST \
                "repos/${REPOSITORY}/git/refs" \
                -f ref='refs/tags/latest' \
                -f sha="${COMMIT_SHA}"
            fi
            gh api --method PATCH \
              "repos/${REPOSITORY}/releases/${release_id}" \
              -f target_commitish="${COMMIT_SHA}" \
              -f prerelease=true
            while IFS= read -r asset; do
              [[ -z "${asset}" ]] || gh release delete-asset latest "${asset}" --yes
            done < <(gh release view latest --json assets --jq '.assets[].name')
            gh release upload latest "${dmg}" "${checksum}" --clobber
          fi

      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' AppResources/Info.plist)"
          gh release create "${GITHUB_REF_NAME}" \
            --title "ListenUp ${GITHUB_REF_NAME}" \
            --generate-notes \
            "release/ListenUp-${version}-arm64-unsigned.dmg" \
            "release/ListenUp-${version}-arm64-unsigned.dmg.sha256"
